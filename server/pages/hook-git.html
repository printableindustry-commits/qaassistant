<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wizard QA Assistant · Hook Git</title>
  <link rel="stylesheet" href="/assets/theme.css" />
  <link rel="stylesheet" href="/assets/home-hub.css" />
  <link rel="stylesheet" href="/assets/css_theme_app.css" />
</head>
<body class="page-hook-git page-hook-compact">
  <div class="wrap hub-app">
    <div class="hub-hero hub-hero--page hub-hero--page-sm hub-hero--has-home-btn">
      <div class="hub-hero-nav">
        <a href="/" class="btn-hub-home" title="Retour au catalogue">Accueil</a>
      </div>
      <div class="hub-hero-page-logo">
        <img src="/assets/logo-git-hook.png" alt="Hook Git" width="40" height="40" />
      </div>
      <div class="hub-hero-page-body">
        <div class="hook-hero-head">
          <h1>Hook Git — JIRA / Xray</h1>
          <div class="hook-hero-badges" aria-live="polite">
            <span class="file-badge" id="badgeHook">Hook …</span>
            <span class="file-badge" id="badgeEnv">.env …</span>
            <span class="file-badge" id="badgeConf">conf …</span>
            <span class="file-badge" id="badgeDryRun">dry-run …</span>
          </div>
        </div>
        <p class="hub-hero-lead">Assistant en plusieurs étapes — <code>.env</code>, <code>hooks.conf</code>, installation et dry-run.</p>
        <p class="hint hint-tight hook-readiness-hint" id="readinessHint" hidden></p>
      </div>
    </div>

    <div id="unlockBanner" class="diff-banner diff-banner-compact hub-diff-banner hub-sync-unlock-banner" hidden>
      <span><strong>Sync JIRA débloquée</strong> — <a href="/project.html">Ouvrir Sync JIRA →</a></span>
    </div>

    <section id="hookWizard" class="hub-onboarding hook-wizard" aria-label="Configuration Hook Git">
      <div id="hookWizardSteps"></div>
    </section>

    <div id="status" class="status hook-status hook-wizard-status" style="display:none"></div>
  </div>
  <script src="/assets/portail.js"></script>
  <script src="/assets/wizard-debug-copilot.js"></script>
  <script src="/assets/wizard-debug-nav.js"></script>
  <script src="/assets/wizard-debug-page-bindings.js"></script>
  <script src="/assets/hook-git.js"></script>
</body>
</html>
