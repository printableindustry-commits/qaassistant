<!DOCTYPE html>
<html lang="fr" class="page-npm-install page-npm-install-compact">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Installer NPM — Wizard QA</title>
  <link rel="icon" href="/assets/logo-qa.png" />
  <link rel="stylesheet" href="/assets/theme.css" />
  <link rel="stylesheet" href="/assets/home-hub.css?v=1.16.3" />
  <link rel="stylesheet" href="/assets/css_theme_app.css?v=1.16.3" />
</head>
<body class="page-npm-install page-npm-install-compact">
  <div class="wrap hub-app">
    <div class="hub-hero hub-hero--page hub-hero--page-sm hub-hero--has-home-btn">
      <div class="hub-hero-nav">
      </div>
      <div class="hub-hero-page-body">
        <div class="npmrc-hero-head">
          <h1>Installer NPM</h1>
          <span class="file-badge" id="npmRuntimeBadge" aria-live="polite">…</span>
        </div>
        <p class="hub-hero-lead">Lance <code>npm install</code> des paquets définis dans <code>npm-install.conf.json</code> — prérequis : <code>.npmrc</code>, Node/Volta et <code>package.json</code>.</p>
      </div>
    </div>

    <section class="card card-compact npmrc-card npmrc-form-card">
      <div class="npmrc-generate-row">
        <div class="npmrc-action-buttons">
          <button type="button" class="btn-primary" id="npmInstallBtn">Installer NPM</button>
        </div>
      </div>

      <div id="status" class="status" style="display:none;margin-top:10px"></div>
      <div id="npmInstallPanel" hidden></div>
    </section>

    <section class="card card-compact npmrc-card npm-page-bottom">
      <div class="npmrc-generate-row">
        <p class="hint hint-tight npmrc-next-step"><a href="/repair.html" id="nextRepairLink">→ Étape suivante : initialiser Cypress</a></p>
        <p class="hint hint-tight npmrc-next-step"><a href="/wiki.html#playwright">→ Documentation Playwright</a></p>
      </div>
    </section>
  </div>
  <script src="/assets/portail.js"></script>
  <script src="/assets/install-autofix.js"></script>
  <script src="/assets/wizard-disclaimer.js?v=1.16.3"></script>
  <script src="/assets/npm-wizard-shared.js?v=1.16.3"></script>
  <script src="/assets/npm-install-page.js?v=1.16.3"></script>
  <script src="/assets/wizard-footer.js?v=1.16.3"></script>
</body>
</html>
